#surface, #board, .title-crest, .show-ui-btn {

  user-select: none !important;
  -webkit-touch-callout: none !important;
  -webkit-tap-highlight-color: transparent;
}
body.focus-drawing, body.focus-drawing *:not(input):not(textarea):not([contenteditable="true"]) {

  -webkit-touch-callout: none !important;
}

g{height:60px;width:68px;object-fit:contain}.sticker-cell span{font-size:10px;color:#785e81}.sticker-cell.selected{outline:2px solid #b991d8}

/* Tablet: keep the board nearly edge-to-edge and controls modest */
@media(max-width:800px){.title-crest{display:none}.topbar{top:max(11px,env(safe-area-inset-top));max-width:calc(100vw - 12px);height:47px}.topbar button{padding:5px 9px;min-width:30px}.topbar .word{font-size:12px}.toolbar{left:8px;padding:7px;width:108px;border-radius:17px;max-height:calc(100dvh - 108px)}.toolbar button{height:42px;padding:6px 8px}.panel{right:8px;top:65px;bottom:70px;width:min(320px,calc(100vw - 74px))}}
@media(max-width:500px){.toolbar button{height:40px;font-size:16px}.toolbar{width:98px;top:51%;gap:5px;max-height:calc(100dvh - 90px);padding:6px}.topbar .optional{display:none}.topbar{gap:1px}.topbar button{font-size:12px;min-width:31px;padding:5px 7px}.panel{width:calc(100vw - 58px)}}

/* V5.2: a quiet, one-column action rail. Editing has no pop-up. */
.toolbar{width:143px;gap:3px;padding:9px;max-height:calc(100dvh - 108px)}
.toolbar button.sidebar-btn{min-height:42px;height:42px;justify-content:flex-start;gap:8px;padding:6px 9px;font-size:15px;flex-shrink:0}
.toolbar .sidebar-btn .mini{font-size:17px;min-width:19px}
.toolbar .sidebar-btn .tool-name{font-size:11.5px;white-space:nowrap;line-height:1.1}
.toolbar .sidebar-divider{height:1px;flex-shrink:0;margin:4px 7px;background:rgba(154,116,167,.22)}

/* Genuine distraction-free drawing mode. Drawing gestures never affect visibility. */
body.focus-drawing .topbar,
body.focus-drawing .toolbar,
body.focus-drawing .title-crest,
body.focus-drawing #panel { display:none !important; }

<body>
<div id="surface"><canvas id="board" aria-label="Drawing board. Use Apple Pencil, stylus, touch, or mouse."></canvas></div>
<div class="title-crest"><div class="mark">🌷</div><div>Tulip Board</div></div>
<div class="floating topbar" aria-label="Board and paper controls">
<button class="board-toggle selected" data-board="white" title="Whiteboard">◻ <span class="word">Whiteboard</span></button>
<button class="board-toggle" data-board="chalk" title="Chalkboard">▣ <span class="word">Chalkboard</span></button>
<span class="divider"></span>
<button id="paperBtn" title="Choose blank, grid, lined or dotted paper">▦ <span class="word optional" id="paperLabel">Blank</span></button>

</div>
<div class="floating toolbar compact-tools" aria-label="Drawing tools and actions">
  <button id="brushBtn" class="sidebar-btn selected" title="Pen, highlighter, glitter, eraser, color, thickness, opacity" aria-label="Open brushes and colors"><span class="mini">🎨</span><span class="tool-name">Ink</span></button>
  <button id="objectsBtn" class="sidebar-btn" title="Move ink, add words, stickers, photos" aria-label="Open art and move tools"><span class="mini">♡</span><span class="tool-name">Art</span></button>
  <div class="sidebar-divider" aria-hidden="true"></div>
  <button id="undoBtn" class="sidebar-btn" title="Undo last change"><span class="mini">↶</span><span class="tool-name">Undo</span></button>
  <button id="redoBtn" class="sidebar-btn" title="Redo last undone change"><span class="mini">↷</span><span class="tool-name">Redo</span></button>
  <button id="deleteBtn" class="sidebar-btn" title="Clear the selected handwriting, words, stickers or pictures"><span class="mini">⌦</span><span class="tool-name">Clear selected</span></button>
  <button id="clearBtn" class="sidebar-btn danger-action" title="Clear the entire board after confirmation"><span class="mini">✕</span><span class="tool-name">Clear all</span></button>
  <div class="sidebar-divider" aria-hidden="true"></div>
  <button id="saveMenuBtn" class="sidebar-btn" title="Save PNG, backup, or restore your board"><span class="mini">↓</span><span class="tool-name">Save</span></button>
  <button id="helpBtn" class="sidebar-btn" title="Instructions and button explanations"><span class="mini">?</span><span class="tool-name">Help</span></button>
  <button id="hideUiBtn" class="sidebar-btn hide-ui" title="Hide all controls so you can draw without distractions"><span class="mini">⛶</span><span class="tool-name">Hide</span></button>
</div>
<button id="showUiBtn" class="show-ui-btn hidden" title="Bring back controls" aria-label="Bring back Tulip Board controls" aria-hidden="true" tabindex="-1">✿</button>
<aside id="panel" class="floating panel hidden" aria-label="Tool options"><div class="panel-header"><h2 id="panelTitle"></h2><button id="closePanel" title="Close options">✕</button></div><p class="panel-sub" id="panelSub"></p><div class="scroll" id="panelBody"></div></aside>
<div id="dropzone">Drop a photo to add it ✿</div>
<div id="toast" class="toast" role="status"></div>
<div id="modalHost"></div>
<input id="photoInput" type="file" accept="image/*" class="sr" multiple/>
<input id="projectInput" type="file" accept="application/json,.json" class="sr"/>

el('panelBody').querySelectorAll('[data-sticker]').forEach(b=>b.onclick=()=>{stamp=b.dataset.sticker;tool='sticker';el('panelBody').querySelectorAll('[data-sticker]').forEach(n=>n.classList.toggle('selected',n===b));const objSelect=el('objectSelect');if(objSelect)objSelect.classList.remove('selected');render();loadSticker(stamp).then(im=>{if(im)stickerRenderCache.set(stamp,im)})});
const penBtn=el('inkPen'),hiBtn=el('inkHighlight'),glBtn=el('inkGlitter'),erBtn=el('inkEraser');const setInkTool=t=>{tool=t;clearSelection();el('panelBody').querySelectorAll('.brush-kind button').forEach(n=>n.classList.toggle('selected',n.id===({pen:'inkPen',highlighter:'inkHighlight',glitter:'inkGlitter',eraser:'inkEraser'}[t])));render()};if(penBtn)penBtn.onclick=()=>setInkTool('pen');if(hiBtn)hiBtn.onclick=()=>setInkTool('highlighter');if(glBtn)glBtn.onclick=()=>setInkTool('glitter');if(erBtn)erBtn.onclick=()=>setInkTool('eraser');const selectObj=el('objectSelect');if(selectObj)selectObj.onclick=()=>{tool='select';clearSelection();render();el('panelBody').querySelectorAll('[data-sticker]').forEach(b=>b.classList.remove('selected'));selectObj.classList.add('selected')};const pngAction=el('pngAction');if(pngAction)pngAction.onclick=exportPNG;const backupAction=el('backupAction');if(backupAction)backupAction.onclick=exportProject;const restoreAction=el('restoreAction');if(restoreAction)restoreAction.onclick=()=>{toast('Choose a Tulip Board backup JSON file to restore');el('projectInput').click()};
const textAdd=el('addTypedText');if(textAdd)textAdd.onclick=()=>editTypedText(null);const textEdit=el('editTypedText');if(textEdit)textEdit.onclick=()=>{const obj=getObject(selectedIds[0]);if(obj?.type==='text')editTypedText(obj)};const cc=el('customColor');if(cc)cc.oninput=e=>{color=e.target.value;el('panelBody').querySelectorAll('[data-color]').forEach(n=>n.classList.remove('selected'))};
const bs=el('brushSize');if(bs)bs.oninput=e=>{size=+e.target.value;el('sizeVal').textContent=size};const op=el('brushOpacity');if(op)op.oninput=e=>{opacity=+e.target.value/100;el('opacityVal').textContent=Math.round(opacity*100)+'%'};const po=el('pencilOnly');if(po)po.onchange=e=>{pencilOnly=e.target.checked;toast(pencilOnly?'Pencil-only mode on':'Touch drawing on')};
const cph=el('choosePhoto');if(cph)cph.onclick=()=>el('photoInput').click();const pst=el('pasteHint');if(pst)pst.onclick=()=>{toast('Copy a photo, then use Paste (⌘V) on this page.')};}
el('closePanel').onclick=hidePanel;
document.querySelectorAll('[data-board]').forEach(b=>b.onclick=()=>setActive(b.dataset.board));
el('paperBtn').onclick=()=>showPanel('paper');
el('brushBtn').onclick=()=>showPanel('colors');
el('objectsBtn').onclick=()=>showPanel('stickers');
el('undoBtn').onclick=()=>restoreHistory('undo');
el('redoBtn').onclick=()=>restoreHistory('redo');
el('deleteBtn').onclick=deleteSelected;
el('clearBtn').onclick=clearBoard;
el('saveMenuBtn').onclick=()=>showPanel('save');
el('helpBtn').onclick=()=>showPanel('help');
function toggleFocus(force){
 const next = typeof force==='boolean' ? force : !readonlyFocus;
 if(next===readonlyFocus)return;
 if(next){
  // Selecting objects or placing stamps shouldn't leave focus mode unable to draw.
  if(tool==='select'||tool==='sticker'){tool='pen';clearSelection();}
  hidePanel();
 }
 readonlyFocus=next;
 document.body.classList.toggle('focus-drawing',readonlyFocus);
 const restoreButton=el('showUiBtn');
 restoreButton.classList.toggle('hidden',!readonlyFocus);
 restoreButton.setAttribute('aria-hidden',String(!readonlyFocus));
 restoreButton.tabIndex=readonlyFocus?0:-1;
 render();
}
el('hideUiBtn').onclick=()=>toggleFocus(true);el('showUiBtn').onclick=()=>toggleFocus(false);
function downloadBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportPNG(){const out=document.createElement('canvas');out.width=2400;out.height=1500;renderTo(out.getContext('2d'),active,{selection:false});out.toBlob(blob=>{if(blob)downloadBlob(blob,`tulip-${active}-${new Date().toISOString().slice(0,10)}.png`);else toast('Could not export image. Try project backup instead.');},'image/png');}

function exportProject(){const blob=new Blob([JSON.stringify({format:'tulip-board-v1',docs,active,exported:new Date().toISOString()})],{type:'application/json'});downloadBlob(blob,'tulip-board-project.json');toast('Editable project downloaded ♡')}

el('projectInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(parsed.format!=='tulip-board-v1'||!parsed.docs?.white||!parsed.docs?.chalk)throw Error('Invalid project');if(!confirm('Restore this backup? This replaces both current boards. Download a Backup first if you want to keep today’s work.'))return;docs=parsed.docs;active=parsed.active==='chalk'?'chalk':'white';history={white:[],chalk:[]};future={white:[],chalk:[]};photoCache.clear();clearSelection();render();scheduleSave();toast('Editable project restored')}catch(err){toast('That project file could not be opened')}e.target.value=''});
function placeImage(data,x=W*.50,y=H*.50){const im=new Image();im.onload=()=>{snapshot();let scale=Math.min(640/im.width,500/im.height,1.5);const o={type:'image',id:newId(),src:data,x:clamp(x-im.width*scale/2,0,W-50),y:clamp(y-im.height*scale/2,0,H-50),w:im.width*scale,h:im.height*scale};photoCache.set(o.id,im);current().items.push(o);selectedId=o.id;selectedIds=[o.id];tool='select';hidePanel();render();scheduleSave();toast('Image added · drag to move or resize')};im.onerror=()=>toast('Unable to open this picture');im.src=data}
async function fileToImage(file,point){if(!file||!file.type.startsWith('image/')){toast('Please choose an image file');return}if(file.size>28*1024*1024){toast('Choose an image under 28 MB');return}const blob=URL.createObjectURL(file);const im=new Image();im.onload=()=>{let mx=1700,scale=Math.min(1,mx/Math.max(im.naturalWidth,im.naturalHeight)),cn=document.createElement('canvas');cn.width=Math.max(1,Math.round(im.naturalWidth*scale));cn.height=Math.max(1,Math.round(im.naturalHeight*scale));let cc=cn.getContext('2d');cc.drawImage(im,0,0,cn.width,cn.height);const data=cn.toDataURL('image/jpeg',0.85);URL.revokeObjectURL(blob);placeImage(data,point?.x??W/2,point?.y??H/2)};im.onerror=()=>{URL.revokeObjectURL(blob);toast('Could not read image file')};im.src=blob}
el('photoInput').onchange=async e=>{for(const file of e.target.files||[])await fileToImage(file);e.target.value=''};
let dragCount=0;document.addEventListener('dragenter',e=>{e.preventDefault();dragCount++;el('dropzone').classList.add('active')});document.addEventListener('dragover',e=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy'});document.addEventListener('dragleave',e=>{e.preventDefault();dragCount--;if(dragCount<=0){dragCount=0;el('dropzone').classList.remove('active')}});
document.addEventListener('drop',async e=>{e.preventDefault();dragCount=0;el('dropzone').classList.remove('active');const p=pos(e);const files=Array.from(e.dataTransfer?.files||[]).filter(f=>f.type.startsWith('image/'));if(files.length){for(const f of files)await fileToImage(f,p);return}const url=e.dataTransfer?.getData('text/uri-list')||e.dataTransfer?.getData('text/plain')||'';if(/^https?:\/\//.test(url)){try{const resp=await fetch(url,{mode:'cors'});if(!resp.ok)throw Error();const blob=await resp.blob();if(!blob.type.startsWith('image/'))throw Error();await fileToImage(new File([blob],'dropped-image.png',{type:blob.type}),p)}catch{toast('That website blocks image dragging. Save the image first or paste it.')}}});
document.addEventListener('paste',async e=>{const items=Array.from(e.clipboardData?.items||[]);const image=items.find(i=>i.type.startsWith('image/'));if(image){e.preventDefault();const file=image.getAsFile();if(file)await fileToImage(file)}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;const meta=e.metaKey||e.ctrlKey;if(meta&&e.key.toLowerCase()==='z'){e.preventDefault();restoreHistory(e.shiftKey?'redo':'undo');return}if(meta&&e.key.toLowerCase()==='y'){e.preventDefault();restoreHistory('redo');return}if(['Backspace','Delete'].includes(e.key)&&selectedIds.length){e.preventDefault();deleteSelected();return}if(e.key==='Escape'){if(readonlyFocus)toggleFocus();else hidePanel();return}const t={p:'pen',h:'highlighter',g:'glitter',e:'eraser',v:'select'}[e.key.toLowerCase()];if(t)selectTool(t)});
// Saved locally in IndexedDB (supports large inserted images), without sending them to a server.
let dbPromise=null;
function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(Error('IndexedDB unavailable'));return}const req=indexedDB.open('tulip-board-local-v1',1);req.onupgradeneeded=()=>{req.result.createObjectStore('data')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function persist(){try{const db=await openDB();await new Promise((resolve,reject)=>{const tr=db.transaction('data','readwrite');tr.objectStore('data').put({docs,active},'workspace');tr.oncomplete=resolve;tr.onerror=()=>reject(tr.error)})}catch{try{localStorage.setItem('tulip-board-fallback',JSON.stringify({docs,active}))}catch{toast('Storage is full — export a project backup to keep your art')}}}
async function loadPersisted(){let data;try{const db=await openDB();data=await new Promise((resolve,reject)=>{const tr=db.transaction('data','readonly');const req=tr.objectStore('data').get('workspace');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}catch{try{data=JSON.parse(localStorage.getItem('tulip-board-fallback'))}catch{}}if(data?.docs?.white?.items&&data?.docs?.chalk?.items){docs=data.docs;active=data.active==='chalk'?'chalk':'white';}render()}
// iPad can install via Add to Home Screen when hosted on HTTPS.
if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
resized();loadPersisted();loadSticker('bunny').then(im=>{if(im)stickerRenderCache.set('bunny',im)});
</script>
